<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Past Events Archive — CampusRadar</title>
  
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <nav class="navbar" id="main-navbar"></nav>

  <main class="container" style="padding-top: var(--space-xl); padding-bottom: var(--space-2xl);">
    <div class="hub-header">
      <h1>Past Events Archive</h1>
      <p style="font-size:1.05rem; color:var(--text-muted); margin-top:4px;">
        Browse past campus contests, hackathons, orientation sessions, and cultural evenings.
      </p>
    </div>

    <!-- Container -->
    <div id="past-events-list-container" class="events-list">
      <div class="loading-state">
        <p>Scanning past archives...</p>
      </div>
    </div>
  </main>

  <footer class="footer" id="main-footer"></footer>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('past-events-list-container');
      if (!container) return;
      try {
        const data = await window.API.getEvents({ past: 'true' });
        const events = data.events || [];
        if (events.length === 0) {
          container.innerHTML = '<div class="empty-state glass-card"><h3>No past events in archive</h3></div>';
          return;
        }
        container.innerHTML = events.map(e => `
          <div class="event-card-item glass-card" style="opacity: 0.85;">
            <div class="event-date-badge" style="border-color: var(--border-subtle); background: rgba(255,255,255,0.02);">
              <div class="event-date-day" style="color:var(--text-muted);">${window.Utils.getDateParts(e.date).day}</div>
              <div class="event-date-month">${window.Utils.getDateParts(e.date).month}</div>
            </div>
            <div class="event-details-col">
              <div style="display:flex; gap:8px; align-items:center;">
                <span class="badge badge-tag" style="background:rgba(255,255,255,0.1);">COMPLETED</span>
                ${(e.categories || []).map(c => `<span class="badge badge-tag">${c}</span>`).join(' ')}
              </div>
              <h3 style="font-size: 1.15rem; margin-top:4px;">${window.Utils.escapeHTML(e.title)}</h3>
              <div class="event-meta-info">
                <span>📍 ${window.Utils.escapeHTML(e.venue)}</span>
                <span>👤 ${window.Utils.escapeHTML(e.organizer)}</span>
              </div>
            </div>
            <div class="event-action-col">
              <span class="badge badge-tag" style="font-size:0.8rem;">Archived</span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<div class="empty-state">Failed to load past events.</div>';
      }
    });
  </script>
</body>
</html>
